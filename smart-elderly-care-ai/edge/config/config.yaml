ai:
  audio:
    alert_classes:
    - Screaming
    - Crying
    - Glass shatter
    - Thud
    alert_confidence_threshold: 0.75
    chunk_duration_sec: 1.0
    model_path: src/ai/audio/models/yamnet.tflite
    sample_rate: 16000
  vision:
    adl_monitoring:
      enabled: true
      sedentary_alert_sec: 3600.0
    confidence_threshold: 0.6
    face_blurring: true
    fall_detection:
      aspect_ratio_threshold: 1.25
      classifier_model: src/ai/vision/models/fall_classifier.pkl
      consecutive_frames: 5
      drop_velocity_threshold: 0.55
      enabled: true
      fallen_angle_threshold: 55.0
      horizontal_ratio_threshold: 0.5
      immobility_alert_sec: 15.0
      max_missed_frames: 25
      min_fallen_duration: 0.4
      motion_energy_threshold: 8.0
      stitching_distance_threshold: 120.0
      tracker_iou_threshold: 0.3
    fallback_model: src/ai/vision/models/yolov8n-pose.onnx
    model_path: src/ai/vision/models/yolov8n-pose.rknn
ble:
  auth_key: 2BC7D23FAA60E6E2F974B8420C56234B
  characteristic_uuid: 00002a37-0000-1000-8000-00805f9b34fb
  device_mac: FA:88:9E:79:77:13
  device_name: Xiaomi Smart Band 7 7713
  enabled: true
  poll_interval_sec: 5
  reconnect_interval_sec: 10
  service_uuid: 0000180d-0000-1000-8000-00805f9b34fb
camera:
  fps: 25
  reconnect_interval_sec: 5
  resolution:
    height: 1080
    width: 1920
  source: 0
device:
  id: hub-orangepi5-001
  location: Living Room
  name: Living Room Hub
  timezone: Asia/Ho_Chi_Minh
fusion:
  alert_clip_after_sec: 2
  alert_debounce_sec: 30
  fall_detection_min_sources: 2
  ring_buffer_duration_sec: 5
logging:
  backup_count: 5
  file: logs/edge.log
  level: INFO
  max_bytes: 10485760
mqtt:
  broker_host: emqx.yourdomain.com
  broker_port: 1883
  broker_tls_port: 8883
  client_id: hub-orangepi5-001
  keepalive: 60
  password: CHANGE_ME_IN_ENV
  qos: 1
  topics:
    alert: care/{device_id}/alert
    command: care/{device_id}/command
    heartbeat: care/{device_id}/heartbeat
    telemetry: care/{device_id}/telemetry
  use_tls: false
  username: edge_hub
speaker:
  device: default
  enabled: true
  language: vi
  reminder_schedule:
  - message: Chào buổi sáng! Đã đến giờ uống thuốc buổi sáng.
    time: 08:00
  - message: Đã đến giờ ăn trưa và uống thuốc.
    time: '12:30'
  - message: Đã đến giờ uống thuốc buổi tối. Chúc ngủ ngon!
    time: '21:00'
  volume: 0.85
streaming:
  enabled: true
  protocol: rtsp
  rtsp_port: 8554
  webrtc_signaling_port: 8080
thermal:
  enabled: true
  i2c_address: 105
  i2c_bus: 1
  poll_interval_sec: 2
thresholds:
  heart_rate:
    max: 120
    min: 50
  presence:
    timeout_minutes: 30
  spo2:
    min: 90
    warning: 94
  temperature:
    skin_max: 38.5
    skin_min: 35.0
