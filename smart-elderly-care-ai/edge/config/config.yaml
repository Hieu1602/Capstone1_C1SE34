# ============================================================
# Edge Hub Configuration - Orange Pi 5
# Smart Elderly Care AI System
# ============================================================

device:
  id: "hub-orangepi5-001"
  name: "Living Room Hub"
  location: "Living Room"
  timezone: "Asia/Ho_Chi_Minh"

# ---- Camera Configuration ----
camera:
  source: "rtsp://admin162:16161616@192.168.1.4:554/stream1"   # RTSP IP Cam
  fps: 15
  resolution:
    width: 1920
    height: 1080
  reconnect_interval_sec: 5

# ---- AI Model Paths ----
ai:
  vision:
    model_path: "src/ai/vision/models/yolov8n-pose.rknn"  # RKNN for NPU
    fallback_model: "src/ai/vision/models/yolov8n-pose.onnx"
    confidence_threshold: 0.60
    face_blurring: true  # Làm mờ mặt thời gian thực bảo vệ quyền riêng tư người già
    fall_detection:
      enabled: true
      # Tỷ lệ chiều cao/rộng bounding box khi ngã (nằm ngang)
      horizontal_ratio_threshold: 0.5
      aspect_ratio_threshold: 1.1
      fallen_angle_threshold: 60.0        # Góc nghiêng cột sống > 60°
      drop_velocity_threshold: 1.2        # Vận tốc rơi hông (chiều cao/giây)
      min_fallen_duration: 0.5            # Thời gian duy trì tư thế thấp (giây)
      immobility_alert_sec: 15.0          # Bất động > 15s sau ngã -> Cảnh báo đột quỵ/hôn mê
      motion_energy_threshold: 8.0        # Ngưỡng dịch chuyển keypoint
      # Multi-person Tracking & Causal Stitching
      tracker_iou_threshold: 0.30
      max_missed_frames: 15               # 1s tại 15fps
      stitching_distance_threshold: 120.0 # Khoảng cách ghép track khi ngã (pixels)
      consecutive_frames: 5

  audio:
    model_path: "src/ai/audio/models/yamnet.tflite"
    sample_rate: 16000
    chunk_duration_sec: 1.0
    alert_classes:
      - "Screaming"
      - "Crying"
      - "Glass shatter"
      - "Thud"
    alert_confidence_threshold: 0.75

# ---- Sensor Thresholds (Ngưỡng cảnh báo) ----
thresholds:
  heart_rate:
    min: 50   # bpm - Nhịp tim chậm bất thường
    max: 120  # bpm - Nhịp tim nhanh bất thường
  spo2:
    min: 90   # % - SpO2 nguy hiểm < 90%
    warning: 94  # % - SpO2 cảnh báo
  temperature:
    skin_max: 38.5  # °C - Nhiệt độ da (AMG8833)
    skin_min: 35.0  # °C - Hạ thân nhiệt
  presence:
    timeout_minutes: 30  # Không phát hiện chuyển động sau N phút -> alert

# ---- BLE Smart Band ----
ble:
  enabled: true
  device_name: "SmartBand_001"
  device_mac: "AA:BB:CC:DD:EE:FF"
  service_uuid: "0000180d-0000-1000-8000-00805f9b34fb"   # Heart Rate Service
  characteristic_uuid: "00002a37-0000-1000-8000-00805f9b34fb"
  reconnect_interval_sec: 10
  poll_interval_sec: 5

# ---- Thermal Camera AMG8833 ----
thermal:
  enabled: true
  i2c_bus: 1
  i2c_address: 0x69  # hoặc 0x68
  poll_interval_sec: 2

# ---- MQTT Broker (EMQX) ----
mqtt:
  broker_host: "emqx.yourdomain.com"
  broker_port: 1883
  broker_tls_port: 8883
  use_tls: false
  username: "edge_hub"
  password: "CHANGE_ME_IN_ENV"
  client_id: "hub-orangepi5-001"
  keepalive: 60
  qos: 1
  topics:
    telemetry: "care/{device_id}/telemetry"
    alert:     "care/{device_id}/alert"
    command:   "care/{device_id}/command"
    heartbeat: "care/{device_id}/heartbeat"

# ---- Sensor Fusion / Decision Matrix ----
fusion:
  # Tối thiểu N nguồn phải đồng thuận để kích hoạt alert
  fall_detection_min_sources: 2
  # Thời gian debounce (giây) tránh spam alert
  alert_debounce_sec: 30
  # Thời gian lưu ring buffer video (giây)
  ring_buffer_duration_sec: 5
  alert_clip_after_sec: 2  # Clip thêm 2s sau sự kiện

# ---- Local Speaker ----
speaker:
  enabled: true
  device: "default"
  volume: 0.85
  language: "vi"
  reminder_schedule:
    - time: "08:00"
      message: "Chào buổi sáng! Đã đến giờ uống thuốc buổi sáng."
    - time: "12:30"
      message: "Đã đến giờ ăn trưa và uống thuốc."
    - time: "21:00"
      message: "Đã đến giờ uống thuốc buổi tối. Chúc ngủ ngon!"

# ---- Local Streaming ----
streaming:
  enabled: true
  protocol: "rtsp"   # rtsp | webrtc
  rtsp_port: 8554
  webrtc_signaling_port: 8080

# ---- Logging ----
logging:
  level: "INFO"   # DEBUG | INFO | WARNING | ERROR
  file: "logs/edge.log"
  max_bytes: 10485760  # 10 MB
  backup_count: 5
