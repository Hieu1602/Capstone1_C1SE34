server {
    listen 443 ssl;
    server_name video-metadata;
    ssl_certificate /etc/nginx/video-tls/certificate.pem;
    ssl_certificate_key /etc/nginx/video-tls/private-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    client_max_body_size 16k;
    resolver 127.0.0.11 valid=10s;

    location = /healthz {
        return 200 "ok\n";
    }

    location = /api/v1/camera/archive {
        limit_except POST { deny all; }
        set $metadata_backend http://backend:8000;
        proxy_pass $metadata_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / { return 404; }
}
